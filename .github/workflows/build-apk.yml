name: Zgradi Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Sestavi APK paket
    runs-on: ubuntu-latest

    steps:
      - name: Prenos izvorne kode
        uses: actions/checkout@v4

      - name: Namestitev Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Namestitev Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Namestitev paketov
        run: npm install --legacy-peer-deps

      - name: Izgradnja spletne aplikacije
        run: npm run build

      - name: Namestitev Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Konfiguracija Android projekta
        env:
          CI: true
        run: |
          npx cap init "Internetni Radio" "si.radio.internetni" --web-dir=dist || true
          npx cap add android || true
          npx cap sync android

      - name: Izgradnja Android APK paketa
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Shranitev APK datoteke za prenos
        uses: actions/upload-artifact@v4
        with:
          name: radio-slovenija-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
