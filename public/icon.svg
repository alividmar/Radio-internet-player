<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Radio body -->
  <g transform="translate(64, 96)">
    <!-- Antenna -->
    <line x1="70" y1="60" x2="190" y2="-20" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="190" cy="-20" r="10" fill="#38bdf8"/>
    
    <!-- Radio casing -->
    <rect x="20" y="60" width="344" height="230" rx="32" fill="#1e293b" stroke="url(#primary)" stroke-width="6"/>
    
    <!-- Speaker grill -->
    <circle cx="110" cy="175" r="65" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
    <circle cx="110" cy="175" r="45" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="6 6"/>
    <circle cx="110" cy="175" r="24" fill="url(#primary)"/>
    <circle cx="110" cy="175" r="10" fill="#f8fafc"/>

    <!-- Display screen -->
    <rect x="200" y="90" width="140" height="75" rx="12" fill="#020617" stroke="#334155" stroke-width="3"/>
    <!-- Wave lines inside screen -->
    <path d="M 215 128 Q 230 108 245 128 T 275 128 T 305 128 T 325 128" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="215" cy="103" r="3" fill="#ef4444"/>
    <text x="225" y="106" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">FM/WEB</text>
    
    <!-- Knobs and buttons -->
    <circle cx="235" cy="210" r="22" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <line x1="235" y1="195" x2="235" y2="210" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="305" cy="210" r="22" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <line x1="305" y1="210" x2="318" y2="200" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

    <!-- Sound waves radiating -->
    <path d="M 110 80 A 95 95 0 0 1 180 115" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 110 50 A 125 125 0 0 1 205 95" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
